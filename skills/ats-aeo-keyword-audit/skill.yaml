id: ats-aeo-keyword-audit
name: ATS and AEO Keyword Audit
when_to_use: >
  Optimizing resumes, CVs, or technical profiles against target job descriptions
  for Workday, Taleo, Greenhouse, and AI Answer Engine Optimization (AEO).
inputs:
  - Target job description (JD) or mandate brief
  - Draft resume or CV markdown
sequence:
  - Decompose JD into mandatory core competencies versus preferred requirements.
  - Extract the top 10-15 semantic entities (tools, architectures, protocols, frameworks).
  - Measure entity density across Summary, Core Competencies, and Professional Experience.
  - Ensure single-column formatting and standard headers to prevent ATS parsing breakage.
  - "Calculate target match density (ideal: 70-85% match without keyword stuffing)."
validate: >
  All target keywords appear naturally in context with real metrics; layout passes single-column ATS parser test.
returns: >
  Keyword density scorecard, missing entity gap analysis, and tailored single-column markdown draft.
approval: >
  Never alter factual job titles or dates to force an ATS match.
